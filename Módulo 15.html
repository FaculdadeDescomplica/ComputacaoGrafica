<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Módulo 15: Renderização em Tempo Real (Iluminação Blinn-Phong e Coordenadas UV)</title>
    <style>
        body {
            margin: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #info {
            margin-bottom: 15px;
            background: rgba(30, 41, 59, 0.9);
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid #334155;
            text-align: center;
        }
        #painel { margin-top: 12px; font-size: 13px; color: #94a3b8; }
        #painel button {
            font-family: monospace; font-size: 13px; cursor: pointer;
            background: #1e293b; color: #f8fafc; border: 1px solid #475569;
            border-radius: 6px; padding: 6px 12px; margin: 0 4px;
        }
        #painel button.on { background: #3b82f6; border-color: #3b82f6; }
        canvas {
            border: 2px solid #334155;
            border-radius: 8px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div id="info">
        <h3>Módulo 15: Shading de Blinn-Phong e Coordenadas UV</h3>
        <p>Cálculo de iluminação local e mapeamento vetorial em tempo real na GPU.</p>
    </div>

    <canvas id="glCanvas" width="600" height="600"></canvas>

    <div id="painel">
        <button id="bAmb" class="on">Ambiente</button>
        <button id="bDif" class="on">Difusa</button>
        <button id="bEsp" class="on">Especular</button>
        <button id="bUv" class="on">Textura UV</button>
    </div>

    <script>
        const canvas = document.getElementById('glCanvas');
        const gl = canvas.getContext('webgl');

        if (!gl) {
            document.getElementById('info').innerHTML = '<h3>WebGL não suportado neste navegador</h3>';
            throw new Error('WebGL não suportado');
        }

        // 1. Vertex Shader: aplica a matriz de projeção e passa normal, posição e UV interpoladas
        const vsSource = `
            attribute vec3 a_position;
            attribute vec3 a_normal;
            attribute vec2 a_uv;

            varying vec3 v_normal;
            varying vec3 v_fragPos;
            varying vec2 v_uv;

            uniform float u_time;
            uniform mat4 u_projection;

            void main() {
                // Rotação em torno de Y para o objeto girar em cena
                float c = cos(u_time * 0.5);
                float s = sin(u_time * 0.5);
                mat3 rotY = mat3(c, 0.0, s,   0.0, 1.0, 0.0,   -s, 0.0, c);

                vec3 posMundo = rotY * a_position;
                posMundo.z -= 4.0;            // afasta o objeto da câmara, que fica na origem

                v_normal = rotY * a_normal;   // a normal gira junto com o objeto
                v_fragPos = posMundo;
                v_uv = a_uv;

                gl_Position = u_projection * vec4(posMundo, 1.0);
            }
        `;

        // 2. Fragment Shader: modelo de iluminação de Blinn-Phong, componente por componente
        const fsSource = `
            precision mediump float;

            varying vec3 v_normal;
            varying vec3 v_fragPos;
            varying vec2 v_uv;

            uniform float u_ambiente;
            uniform float u_difusa;
            uniform float u_especular;
            uniform float u_textura;

            void main() {
                vec3 normal = normalize(v_normal);
                vec3 lightPos = vec3(2.0, 2.0, 0.0);   // fonte de luz à frente e acima
                vec3 viewPos  = vec3(0.0, 0.0, 0.0);   // câmara na origem, olhando para -Z

                // Cor base: xadrez procedural gerado a partir das coordenadas UV
                float xadrez = step(0.5, fract(v_uv.x * 8.0)) * step(0.5, fract(v_uv.y * 8.0))
                             + step(0.5, fract(v_uv.x * 8.0 + 0.5)) * step(0.5, fract(v_uv.y * 8.0 + 0.5));
                vec3 corBase = mix(vec3(0.23, 0.51, 0.96),
                                   mix(vec3(0.16, 0.30, 0.60), vec3(0.45, 0.70, 1.0), xadrez),
                                   u_textura);

                // A. Componente ambiente: luz de preenchimento, igual em toda a superfície
                vec3 ambient = 0.18 * vec3(1.0) * u_ambiente;

                // B. Componente difusa: lei de Lambert, depende do ângulo entre normal e luz
                vec3 lightDir = normalize(lightPos - v_fragPos);
                float diff = max(dot(normal, lightDir), 0.0);
                vec3 diffuse = diff * vec3(1.0) * u_difusa;

                // C. Componente especular: Blinn-Phong usa o vetor halfway no lugar do refletido
                vec3 viewDir = normalize(viewPos - v_fragPos);
                vec3 halfwayDir = normalize(lightDir + viewDir);
                float spec = pow(max(dot(normal, halfwayDir), 0.0), 48.0);
                vec3 specular = spec * vec3(1.0) * u_especular;

                // Ambiente e difusa colorem o objeto; o brilho especular entra por cima, branco
                vec3 result = (ambient + diffuse) * corBase + specular;
                gl_FragColor = vec4(result, 1.0);
            }
        `;

        function compileShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                throw new Error('Erro no shader: ' + gl.getShaderInfoLog(shader));
            }
            return shader;
        }

        const program = gl.createProgram();
        gl.attachShader(program, compileShader(gl, gl.VERTEX_SHADER, vsSource));
        gl.attachShader(program, compileShader(gl, gl.FRAGMENT_SHADER, fsSource));
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            throw new Error('Erro ao linkar: ' + gl.getProgramInfoLog(program));
        }
        gl.useProgram(program);

        // 3. Geometria: esfera gerada por paralelos e meridianos, com normal e UV em cada vértice
        function criarEsfera(raio, faixas, setores) {
            const dados = [];
            function vertice(i, j) {
                const phi = Math.PI * i / faixas;           // ângulo do polo ao equador
                const theta = 2 * Math.PI * j / setores;    // ângulo em volta do eixo
                const nx = Math.sin(phi) * Math.cos(theta);
                const ny = Math.cos(phi);
                const nz = Math.sin(phi) * Math.sin(theta);
                // Numa esfera centrada na origem a normal é a própria direção do ponto
                dados.push(nx * raio, ny * raio, nz * raio, nx, ny, nz, j / setores, 1 - i / faixas);
            }
            for (let i = 0; i < faixas; i++) {
                for (let j = 0; j < setores; j++) {
                    vertice(i, j);     vertice(i + 1, j);     vertice(i, j + 1);
                    vertice(i + 1, j); vertice(i + 1, j + 1); vertice(i, j + 1);
                }
            }
            return new Float32Array(dados);
        }

        const vertexData = criarEsfera(1.3, 32, 48);
        const totalVertices = vertexData.length / 8;

        const vbo = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.bufferData(gl.ARRAY_BUFFER, vertexData, gl.STATIC_DRAW);

        const stride = 8 * Float32Array.BYTES_PER_ELEMENT; // 3 posição + 3 normal + 2 UV

        const aPos = gl.getAttribLocation(program, 'a_position');
        gl.enableVertexAttribArray(aPos);
        gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, stride, 0);

        const aNorm = gl.getAttribLocation(program, 'a_normal');
        gl.enableVertexAttribArray(aNorm);
        gl.vertexAttribPointer(aNorm, 3, gl.FLOAT, false, stride, 3 * Float32Array.BYTES_PER_ELEMENT);

        const aUv = gl.getAttribLocation(program, 'a_uv');
        gl.enableVertexAttribArray(aUv);
        gl.vertexAttribPointer(aUv, 2, gl.FLOAT, false, stride, 6 * Float32Array.BYTES_PER_ELEMENT);

        // Matriz de projeção em perspectiva, montada na mão para ficar explícita
        function matrizPerspectiva(fovGraus, aspecto, perto, longe) {
            const f = 1.0 / Math.tan(fovGraus * Math.PI / 360);
            return new Float32Array([
                f / aspecto, 0, 0,                               0,
                0,           f, 0,                               0,
                0,           0, (longe + perto) / (perto - longe), -1,
                0,           0, (2 * longe * perto) / (perto - longe), 0
            ]);
        }
        gl.uniformMatrix4fv(gl.getUniformLocation(program, 'u_projection'), false,
                            matrizPerspectiva(45, canvas.width / canvas.height, 0.1, 100));

        const uTime = gl.getUniformLocation(program, 'u_time');
        const uAmb  = gl.getUniformLocation(program, 'u_ambiente');
        const uDif  = gl.getUniformLocation(program, 'u_difusa');
        const uEsp  = gl.getUniformLocation(program, 'u_especular');
        const uTex  = gl.getUniformLocation(program, 'u_textura');

        // Botões para ligar e desligar cada componente durante a explicação
        const estado = { ambiente: 1, difusa: 1, especular: 1, textura: 1 };
        function alternar(id, chave) {
            const b = document.getElementById(id);
            b.onclick = () => { estado[chave] = estado[chave] ? 0 : 1; b.classList.toggle('on', !!estado[chave]); };
        }
        alternar('bAmb', 'ambiente');
        alternar('bDif', 'difusa');
        alternar('bEsp', 'especular');
        alternar('bUv',  'textura');

        // 4. Loop de renderização contínuo
        const startTime = Date.now();
        gl.enable(gl.DEPTH_TEST);

        function render() {
            const time = (Date.now() - startTime) / 1000;

            gl.clearColor(0.06, 0.09, 0.16, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

            gl.uniform1f(uTime, time);
            gl.uniform1f(uAmb, estado.ambiente);
            gl.uniform1f(uDif, estado.difusa);
            gl.uniform1f(uEsp, estado.especular);
            gl.uniform1f(uTex, estado.textura);

            gl.drawArrays(gl.TRIANGLES, 0, totalVertices);
            requestAnimationFrame(render);
        }
        render();
    </script>
</body>
</html>
