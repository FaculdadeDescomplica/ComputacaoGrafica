<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Módulo 8: Matrizes de Transformação Homogênea (Three.js)</title>
    <style>
        body { margin: 0; background-color: #0f172a; color: #f8fafc; font-family: monospace; }
        canvas { display: block; }
        #info {
            position: absolute; top: 10px; left: 10px;
            background: rgba(15, 23, 42, 0.85); padding: 15px;
            border-radius: 8px; border: 1px solid #334155; max-width: 330px;
        }
        #info h3 { margin: 0 0 6px 0; }
        #info p { margin: 0 0 10px 0; color: #94a3b8; font-size: 13px; }
        #matriz {
            font-size: 13px; line-height: 1.5; white-space: pre;
            background: #0b1220; border: 1px solid #1e293b; border-radius: 6px; padding: 10px;
        }
        #ordem { margin-top: 10px; font-size: 13px; color: #94a3b8; }
        button {
            font-family: monospace; font-size: 13px; cursor: pointer; background: #1e293b;
            color: #f8fafc; border: 1px solid #475569; border-radius: 6px; padding: 6px 12px; margin-top: 6px;
        }
    </style>
</head>
<body>
    <div id="info">
        <h3>Módulo 8: Pipeline de Matrizes Homogêneas</h3>
        <p>Composição de matrizes 4x4 aplicadas a um objeto em coordenadas homogêneas.</p>
        <div id="matriz"></div>
        <div id="ordem">ordem atual: T · R · S</div>
        <button id="bOrdem">Inverter a ordem</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 1. Configuração inicial do ambiente (matriz de visualização e de projeção)
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 6);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);

        scene.add(new THREE.GridHelper(10, 10, 0x3b82f6, 0x1e293b));

        // 2. Criação da geometria (o objeto gráfico)
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.3 });
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        // Desligamos a atualização automática para controlar a matriz Model na mão
        mesh.matrixAutoUpdate = false;

        // 3. As três matrizes homogêneas 4x4 e a matriz composta
        const scaleMatrix = new THREE.Matrix4();
        const rotationMatrix = new THREE.Matrix4();
        const translationMatrix = new THREE.Matrix4();
        const compositeModelMatrix = new THREE.Matrix4();

        let theta = 0;
        let ordemDireta = true;   // true: T · R · S     false: S · R · T

        document.getElementById('bOrdem').onclick = () => {
            ordemDireta = !ordemDireta;
            document.getElementById('ordem').textContent =
                'ordem atual: ' + (ordemDireta ? 'T · R · S' : 'S · R · T');
        };

        // Escreve a matriz na tela em formato de linhas e colunas
        function mostrarMatriz(m) {
            const e = m.elements;   // o Three.js guarda os elementos por coluna
            let txt = '';
            for (let linha = 0; linha < 4; linha++) {
                for (let coluna = 0; coluna < 4; coluna++) {
                    txt += e[coluna * 4 + linha].toFixed(2).padStart(7);
                }
                txt += '\n';
            }
            document.getElementById('matriz').textContent = txt;
        }

        function animate() {
            requestAnimationFrame(animate);
            theta += 0.02;

            // A. Matriz de escala, pulsando para que a sua contribuição fique visível
            const s = 1.0 + 0.4 * Math.sin(theta * 1.3);
            scaleMatrix.makeScale(s, s, s);

            // B. Matriz de rotação, composta em Y e em X
            const rotY = new THREE.Matrix4().makeRotationY(theta);
            const rotX = new THREE.Matrix4().makeRotationX(theta * 0.5);
            rotationMatrix.multiplyMatrices(rotY, rotX);

            // C. Matriz de translação
            translationMatrix.makeTranslation(Math.sin(theta) * 1.5, 0.5, 0);

            // D. Composição: a multiplicação de matrizes é associativa, mas não é comutativa,
            // e é por isso que trocar a ordem muda o resultado na tela
            compositeModelMatrix.identity();
            if (ordemDireta) {
                compositeModelMatrix.multiply(translationMatrix);
                compositeModelMatrix.multiply(rotationMatrix);
                compositeModelMatrix.multiply(scaleMatrix);
            } else {
                compositeModelMatrix.multiply(scaleMatrix);
                compositeModelMatrix.multiply(rotationMatrix);
                compositeModelMatrix.multiply(translationMatrix);
            }

            // E. A matriz composta é aplicada direto no objeto
            mesh.matrix.copy(compositeModelMatrix);
            mostrarMatriz(compositeModelMatrix);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
